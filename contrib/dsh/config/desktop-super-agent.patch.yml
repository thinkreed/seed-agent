# 桌面版（Electron）挂载 Super-agent 的 profile 行模板。
#
# 用法：把本文件的 insert 块追加到 `$DSH_HOME/profiles/desktop/cordis.patch.yml`，
# 并把两个包 link 进该 profile（见 docs/dsh-variant.md §M4）。
#
# 注意：路径按本机仓库位置替换；dshHome 必须与主应用隔离，避免嵌套 SDK runtime 干扰。
- insert:
    - id: super-agent-host
      name: '@deepseek-ai/dsh-super-agent-host'
      config:
        dbPath: .seed/super-agent.db
        slots: 2
        dshBin: <REPO>/dsh/apps/cli/lib/bin.js
        dshHome: <REPO>/dsh/apps/desktop/.desktop-build/sa-runtime-home
        dshProfile: sdk
        dshProvider: bailian
        dshModel: deepseek-v4.1-flash
        dshPatch: <REPO>/dsh/config/sdk-bailian.patch.yml
        workspace: <REPO>
    - id: super-agent-ui
      name: '@deepseek-ai/dsh-client-ui-super-agent'