# 让 sdk profile 使用本机 BAILIAN key 的 OpenAI 兼容端点（token-plan）。
# 用法：dsh --profile sdk --patch <this file>
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      bailian:
        displayName: Bailian
        apiKeyEnv: BAILIAN_API_KEY
        api: openai-completions
        baseURL: https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1
        defaultContextWindow: 100000
        defaultMaxTokens: 8192
        defaultInput:
          - text
        compat:
          supportsDeveloperRole: false
          supportsStore: false
          supportsStrictMode: true
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 100000
            maxTokens: 8192
            input:
              - text
            compat:
              supportsReasoningEffort: false

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: bailian
    model: deepseek-v4.1-flash
- insert:
    - id: super-agent-tool-recall
      name: '__SUPER_AGENT_RECALL_TOOL__'
- insert:
    - id: super-agent-tool-background
      name: '__SUPER_AGENT_BACKGROUND_TOOL__'
- insert:
    - id: super-agent-tool-control
      name: '__SUPER_AGENT_CONTROL_TOOL__'
