# SDK worker profile for the packaged Super-agent：provider + 四个 worker 工具（按包名挂载，随安装 runtime 发布）。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      bailian:
        displayName: Bailian
        apiKeyEnv: BAILIAN_API_KEY
        api: openai-completions
        baseURL: https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1
        defaultContextWindow: 100000
        defaultMaxTokens: 8192
        defaultInput:
          - text
        compat:
          supportsDeveloperRole: false
          supportsStore: false
          supportsStrictMode: true
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 100000
            maxTokens: 8192
            input:
              - text
            compat:
              supportsReasoningEffort: false
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: bailian
    model: deepseek-v4.1-flash
- insert:
    - id: super-agent-tool-recall
      name: '@deepseek-ai/dsh-super-agent-tool-recall'
    - id: super-agent-tool-background
      name: '@deepseek-ai/dsh-super-agent-tool-background'
    - id: super-agent-tool-control
      name: '@deepseek-ai/dsh-super-agent-tool-control'
    - id: super-agent-tool-remote
      name: '@deepseek-ai/dsh-super-agent-tool-remote'