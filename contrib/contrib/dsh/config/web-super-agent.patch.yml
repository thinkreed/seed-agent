# 在 web profile 上挂 Super-agent：host 引擎 + 客户端工作台。
# 用法：dsh web --patch config/web-super-agent.patch.yml --patch config/sdk-bailian.patch.yml
- insert:
    - id: super-agent-host
      name: '@deepseek-ai/dsh-super-agent-host'
      config:
        dbPath: .seed/super-agent.db
        slots: 2
        # 真机执行器（DSH runtime 子进程）；与 dshBin/dshHome 保持一致
        dshBin: ''
        dshHome: ''

    - id: super-agent-ui
      name: '@deepseek-ai/dsh-client-ui-super-agent'