<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>seed-agent · Super-agent Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-theme="light">
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.4 6.6 6.9 2.8-6.9 2.8L12 21.4l-2.4-6.6L2.7 12l6.9-2.8z" fill="currentColor"/></svg>
          </span>
          <span class="wordmark">seed <span class="wordmark-light">agent</span></span>
          <span class="badge">1.0</span>
        </div>

        <button class="new-task" id="new-task" type="button">
          <span class="plus">＋</span><span>新任务</span>
        </button>

        <nav class="nav">
          <div class="nav-label">工单</div>
          <button class="nav-item active" data-filter="all">
            <span>全部工单</span><span class="nav-count" id="count-all">0</span>
          </button>
          <button class="nav-item" data-filter="waiting">
            <span>待人工</span><span class="nav-count" id="count-waiting">0</span>
          </button>
          <button class="nav-item" data-filter="open">
            <span>进行中</span><span class="nav-count" id="count-open">0</span>
          </button>
          <button class="nav-item" data-filter="ended">
            <span>已结束</span><span class="nav-count" id="count-ended">0</span>
          </button>
        </nav>

        <div class="workspace-label">工作区</div>
        <div class="ticket-list" id="tickets"></div>

        <div class="sidebar-foot">
          <button class="ghost" id="theme-toggle" type="button">切换主题</button>
          <span class="muted" id="seq"></span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <span class="source-dot" id="head-source"></span>
            <span id="head-title">选择一个工单</span>
          </div>
          <div class="topbar-meta">
            <span class="chip" id="head-stage"></span>
            <button class="chip-button" id="retry-btn" disabled>重试</button>
          </div>
        </header>

        <div class="status-line">
          <span class="status-pill" id="status-pill">
            <span class="dot" id="status-dot"></span><span id="status-text">连接中…</span>
          </span>
          <button class="chip-button" id="toggle-pause" type="button">暂停</button>
          <span class="muted" id="metrics"></span>
        </div>

        <section class="thread" id="timeline">
          <div class="empty">从左侧选择一个工单，查看它的执行过程。</div>
        </section>

        <form class="composer" id="composer">
          <button type="button" class="composer-plus" id="focus-reply" title="回复">＋</button>
          <textarea id="reply-text" rows="1" placeholder="回复这个工单，或补充上下文…"></textarea>
          <span class="model-chip">deepseek-v4.1-flash</span>
          <button type="submit" id="send-btn" title="发送（Ctrl+Enter）" aria-label="发送">↑</button>
        </form>
      </main>

      <aside class="inspector">
        <div class="inspector-head">
          <h3>事件流</h3>
          <span class="muted" id="event-count"></span>
        </div>
        <div class="events" id="events"></div>

        <div class="inspector-head"><h3>授权</h3></div>
        <dl class="mandate">
          <dt>来源</dt><dd id="m-source">—</dd>
          <dt>发起人</dt><dd id="m-actor">—</dd>
          <dt>范围</dt><dd id="m-scope">—</dd>
          <dt>强度</dt><dd id="m-strength">—</dd>
          <dt>策略</dt><dd id="m-policy">—</dd>
        </dl>
      </aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
